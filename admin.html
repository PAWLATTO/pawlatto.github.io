<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PawLatto Admin</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="top-bar">

<h1>PawLatto Admin Dashboard</h1>

</header>

<section class="stats">

<div class="card">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>D
</div>

<div class="card">
<h2 id="pendingOrders">0</h2>
<p>Pending</p>
</div>

<div class="card">
<h2 id="processingOrders">0</h2>
<p>Processing</p>
</div>

<div class="card">
<h2 id="completedOrders">0</h2>
<p>Completed</p>
</div>

</section>

<section class="orders">

<input
type="text"
id="searchOrders"
placeholder="Search customer or order..."
>

<table>

<thead>

<tr>
    <th>Order ID</th>
    <th>Date</th>
    <th>Customer</th>
    <th>Total</th>
    <th>Payment</th>
    <th>Status</th>
    <th>Actions</th>
</tr>
  
</thead>

<tbody id="ordersTable">

</tbody>

</table>

</section>

<script src="admin.js"></script>

</body>
</html>
